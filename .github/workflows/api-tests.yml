name: API tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # nightly
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEWMAN_ENV: ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build collections and run Newman
        run: npm test
      - name: Prepare report site
        if: always()
        run: cp pages/index.html reports/index.html
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: newman-reports
          path: reports/
          retention-days: 14
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports

  deploy:
    needs: newman
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
